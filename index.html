<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mi Canasta: compará tu compra entre supermercados de Corrientes.">
  <title>Mi Canasta</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero" aria-labelledby="titulo">
      <p class="eyebrow">CORRIENTES</p>
      <h1 id="titulo">Mi Canasta</h1>
      <p class="intro">Escribí lo que querés comprar y te mostramos dónde te conviene.</p>

      <label for="lista">¿Qué vas a comprar hoy?</label>
      <textarea id="lista" rows="6" placeholder="Ejemplo:\nLeche La Serenísima\nAzúcar Ledesma\nCafé Nescafé\nYerba Playadito\nArroz Gallo"></textarea>

      <button id="comparar" class="primary" type="button">🛒 COMPARAR MI CANASTA</button>
      <div class="purchase-actions" aria-label="Opciones de compra">
        <a id="delivery" class="action-button delivery" href="#resultados">🛵 COMPRAR CON DELIVERY / ONLINE</a>
        <a id="supermercado" class="action-button supermarket" href="#resultados">🏪 IR AL SUPERMERCADO</a>
      </div>
    </section>

    <section id="resultados" class="results" aria-live="polite">
      <div class="results-head">
        <div>
          <p class="eyebrow">COMPARACIÓN</p>
          <h2>¿Dónde sale menos?</h2>
        </div>
      </div>
      <div id="lista-resultados" class="cards"></div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
